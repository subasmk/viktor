<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'"><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:transparent;overflow:hidden;width:380px;height:220px}
  body{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;font-family:'JetBrains Mono',monospace;-webkit-app-region:drag;user-select:none}
  #catCol{display:flex;flex-direction:column;align-items:center;justify-content:center;width:180px;height:220px;flex:none;transition:transform .7s ease,opacity .7s ease}
  #catCol.gone{transform:translateX(170px) rotate(10deg);opacity:0}
  #bubbleWrap{position:relative;margin-right:12px;margin-bottom:46px;max-width:190px;background:#fff;border:3px solid #241239;border-radius:14px;padding:9px 12px;opacity:0;transform:scale(.7);transform-origin:bottom right;transition:opacity .18s ease-out,transform .18s cubic-bezier(.34,1.56,.64,1);-webkit-app-region:no-drag}
  #bubbleWrap.show{opacity:1;transform:scale(1)}
  #bubbleDest{font-family:'JetBrains Mono';font-size:9px;color:#6b6380;margin-top:4px}
  #bubbleDest:empty{display:none}
  #bubble{color:#241239;font-family:'Pixelify Sans';font-size:13px;line-height:1.25;word-wrap:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  #bubbleWrap::after{content:'';position:absolute;right:-16px;top:calc(50% - 8px);border:8px solid transparent;border-left:8px solid #241239}
  #bubbleWrap::before{content:'';position:absolute;right:-9px;top:calc(50% - 5px);border:5px solid transparent;border-left:5px solid #fff;z-index:1}
  #sprite{filter:drop-shadow(0 0 16px rgba(147,51,234,.55));-webkit-app-region:no-drag;cursor:pointer;animation:bob 6s ease-in-out infinite}
  #sprite.listening{filter:drop-shadow(0 0 26px rgba(176,92,255,.95));animation:bob 2.2s ease-in-out infinite}
  #sprite.speaking{filter:drop-shadow(0 0 26px rgba(176,92,255,.95));animation:bob 1.6s ease-in-out infinite}
  #sprite.working{animation:sway 1.6s ease-in-out infinite}
  #sprite.happy{filter:drop-shadow(0 0 22px rgba(176,92,255,.9));animation:jump .7s ease-in-out infinite}
  @keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}60%{transform:translateY(-12px)}}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  #sprite.sleepy{filter:grayscale(.4) drop-shadow(0 0 8px rgba(147,51,234,.3));animation:bob 9s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  #spriteImg{display:none;max-width:172px;max-height:150px;object-fit:contain;-webkit-app-region:no-drag;cursor:pointer;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));animation:bob 6s ease-in-out infinite}
  #spriteImg.shiba-listening{filter:drop-shadow(0 0 18px rgba(176,92,255,.8));animation:bob 2.2s ease-in-out infinite}
  #spriteImg.shiba-speaking{animation:bob 1.4s ease-in-out infinite}
  #spriteImg.shiba-working{animation:sway 1.6s ease-in-out infinite}
  #spriteImg.shiba-happy{animation:jump .7s ease-in-out infinite}
  #spriteImg.shiba-walk{animation:bob .56s ease-in-out infinite}
  #spriteImg.shiba-sleep,#spriteImg.shiba-sleepy{filter:grayscale(.35) drop-shadow(0 4px 10px rgba(0,0,0,.4));animation:bob 9s ease-in-out infinite}
  #state{margin-top:8px;font-size:10px;color:#cfc3e8;background:rgba(20,16,28,.85);border:1px solid rgba(176,92,255,.35);border-radius:999px;padding:3px 10px;-webkit-app-region:no-drag}
  #hint{font-family:'Pixelify Sans';font-size:9px;color:#8b8699;margin-top:5px;opacity:0;transition:opacity .3s}
  body:hover #hint{opacity:1}
</style></head>
<body>
  <div id="bubbleWrap"><div id="bubble"></div><div id="bubbleDest"></div></div>
  <div id="catCol">
    <canvas id="sprite" width="120" height="120" title="Click: talk · Drag: move · Right-click: menu"></canvas>
    <img id="spriteImg" alt="VIKTOR" title="Click: talk · Drag: move · Right-click: menu">
    <div id="state">starting…</div>
    <div id="hint">click = talk · drag = move</div>
  </div>
  <script src="mascot.js"></script>
  <script src="mascot-sprite.js"></script>
  <script src="persona.js"></script>
  <script src="overlay.js"></script>
</body></html>
