<!DOCTYPE html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:transparent;overflow:hidden;width:180px;height:220px}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;-webkit-app-region:drag;user-select:none}
  #sprite{filter:drop-shadow(0 0 16px rgba(147,51,234,.55));-webkit-app-region:no-drag;cursor:pointer;animation:bob 6s ease-in-out infinite}
  #sprite.listening{filter:drop-shadow(0 0 26px rgba(176,92,255,.95));animation:bob 2.2s ease-in-out infinite}
  #sprite.speaking{filter:drop-shadow(0 0 26px rgba(176,92,255,.95));animation:bob 1.6s ease-in-out infinite}
  #sprite.working{animation:bob 1.2s ease-in-out infinite}
  #sprite.sleepy{filter:grayscale(.4) drop-shadow(0 0 8px rgba(147,51,234,.3));animation:bob 9s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  #state{margin-top:8px;font-size:10px;color:#cfc3e8;background:rgba(20,16,28,.85);border:1px solid rgba(176,92,255,.35);border-radius:999px;padding:3px 10px;-webkit-app-region:no-drag}
  #hint{font-family:'Pixelify Sans';font-size:9px;color:#8b8699;margin-top:5px;opacity:0;transition:opacity .3s}
  body:hover #hint{opacity:1}
</style></head>
<body>
  <canvas id="sprite" width="120" height="120" title="Click: console · Drag: move · Right-click: menu"></canvas>
  <div id="state">starting…</div>
  <div id="hint">click = console · drag = move</div>
  <script src="mascot.js"></script>
  <script src="overlay.js"></script>
</body></html>
